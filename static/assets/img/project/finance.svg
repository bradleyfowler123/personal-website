<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent" />

  <g filter="url(#shadow)">
    <rect x="85" y="210" width="56" height="110" rx="28" fill="url(#barGrad)" />
    <rect x="172" y="140" width="56" height="180" rx="28" fill="url(#barGrad)" />
    <rect x="259" y="70" width="56" height="250" rx="28" fill="url(#barGrad)" />
  </g>

  <g filter="url(#arrowShadow)">
    <path d="M 40 250 C 110 250, 150 160, 215 130 S 300 80, 340 40 M 290 40 L 340 40 L 340 90" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
